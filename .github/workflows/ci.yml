name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Train model
        run: python -m churnguard.train
      - name: Run tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t churnguard .
      - name: Start container and wait for healthy
        run: |
          docker run -d -p 8501:8501 --name churnguard churnguard
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8501/_stcore/health; then echo " healthy"; exit 0; fi
            sleep 2
          done
          docker logs churnguard
          exit 1
